<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab — Catronin</title>
<meta name="description" content="Experiments and fictional marketing pages.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#0a0a0c; --paper:#e8e5de; --dim:#8b8478; --line:#23232a; --accent:#c9a227; --mono:ui-monospace,"SF Mono",Menlo,monospace; --serif:"Iowan Old Style",Palatino,Georgia,serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ink); color:var(--paper); font-family:var(--serif); }
  .wrap { max-width:960px; margin:0 auto; padding:48px 24px 96px; }
  h1 { font-weight:400; font-size:38px; margin:0 0 8px; }
  p.sub { color:var(--dim); margin:0 0 40px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  li a { display:flex; justify-content:space-between; gap:16px; padding:20px 4px; text-decoration:none; color:inherit; }
  li a:hover { background:#101014; }
  .name { font-size:20px; }
  .kind { font-family:var(--mono); font-size:12px; color:var(--accent); letter-spacing:.1em; text-transform:uppercase; align-self:center; }
  a.back { font-family:var(--mono); font-size:12px; color:var(--dim); text-decoration:none; letter-spacing:.12em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Catronin</a>
  <h1>Lab</h1>
  <p class="sub">Experiments, studies, and marketing pages for products that do not exist.</p>
  <ul>
    <li><a href="/labs/fieldnote/"><span class="name">Fieldnote</span><span class="kind">Fictional product page</span></a></li>
    <li><a href="/"><span class="name">Volumetric field</span><span class="kind">WebGL study</span></a></li>
  </ul>
</div>
</body>
</html>
