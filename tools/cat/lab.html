<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Lab</title>
<!-- Dev-only: served by `npm run dev` at /tools/cat/lab.html, never in the production build. -->
<style>
  :root { color-scheme: dark; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { margin: 0; background: #0b0c12; color: #ede5d3; display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  body.paper { background: #efe3c6; color: #2a231f; }
  aside { padding: 16px; border-right: 1px solid #2c2b33; overflow: auto; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  h2 { font-size: 12px; margin: 20px 0 8px; opacity: .7; font-weight: 500; }
  button { display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3942; background: transparent; color: inherit; cursor: pointer; font: inherit; }
  button[aria-pressed="true"] { background: #e6b25a; color: #1a1612; border-color: #e6b25a; }
  label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  code { font-size: 12px; opacity: .8; }
  main { position: relative; }
  #stats { position: absolute; left: 12px; bottom: 12px; font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<aside>
  <h1>Cat Lab</h1>
  <p>Edit <code>tools/cat/clips.json</code>, run <code>npm run cat</code>, then reload.</p>
  <h2>Clips</h2>
  <div id="clips"></div>
  <h2>Pose</h2>
  <label><input type="checkbox" id="posing"> Pose mode (pauses clips)</label>
  <select id="bone" style="width:100%;margin:4px 0 8px"></select>
  <label>Pitch <input type="range" id="pitch" min="-120" max="120" value="0"><output for="pitch">0</output></label>
  <label>Yaw <input type="range" id="yaw" min="-120" max="120" value="0"><output for="yaw">0</output></label>
  <label>Roll <input type="range" id="roll" min="-120" max="120" value="0"><output for="roll">0</output></label>
  <textarea id="snippet" readonly rows="6" style="width:100%;font:12px ui-monospace,monospace;background:transparent;color:inherit;border:1px solid #3a3942;border-radius:6px"></textarea>
  <button id="copy">Copy pose as clip keys</button>
  <button id="reset">Reset pose</button>
  <h2>View</h2>
  <label><input type="checkbox" id="spin"> Turntable</label>
  <label><input type="checkbox" id="paper"> Paper background</label>
  <label>Speed <input type="range" id="speed" min="0" max="2" step="0.05" value="1"></label>
</aside>
<main id="stage"><div id="stats"></div></main>
<script type="module" src="./lab.js"></script>
</body>
</html>
